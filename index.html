<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Dice Roller</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
  <h1>🎲 Interactive Dice Roller</h1>
  <div class="dice" id="dice">
    <!-- 9 grid spots for dice dots -->
    <div class="dot" id="dot1"></div>
    <div class="dot" id="dot2"></div>
    <div class="dot" id="dot3"></div>
    <div class="dot" id="dot4"></div>
    <div class="dot" id="dot5"></div>
    <div class="dot" id="dot6"></div>
    <div class="dot" id="dot7"></div>
    <div class="dot" id="dot8"></div>
    <div class="dot" id="dot9"></div>
  </div>
  <button onclick="roll()">Roll</button>
  <div class="result" id="result">Click Roll to Start</div>
  <script src="index.js"></script>
</body>
</html>
